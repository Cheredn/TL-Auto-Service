<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="300" height="280">
  <defs>
    <!-- 3D Metallic Red Ring Gradient -->
    <radialGradient id="tlRedGradientDark" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="35%" stop-color="#DE1B1B" />
      <stop offset="75%" stop-color="#9C0A0A" />
      <stop offset="100%" stop-color="#550303" />
    </radialGradient>
    <linearGradient id="tlBezelGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4D0C0C" />
      <stop offset="50%" stop-color="#1A0202" />
      <stop offset="100%" stop-color="#5E1010" />
    </linearGradient>
    <linearGradient id="tlGlossDark" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- 1. Central Red Emblem (Medallion) -->
  <g transform="translate(150, 80)">
    <!-- Outer metallic bevel ring -->
    <circle cx="0" cy="0" r="58" fill="url(#tlBezelGradientDark)" stroke="#9C1A1A" stroke-width="2" />
    
    <!-- Glossy Red Inner Sphere -->
    <circle cx="0" cy="0" r="54" fill="url(#tlRedGradientDark)" />
    
    <!-- Top inner specular highlight -->
    <path d="M -43,-16 A 48,48 0 0,1 43,-16 A 50,43 0 0,0 -43,-16 Z" fill="url(#tlGlossDark)" />

    <!-- Pure White Mechanic + Car on Lift Graphic -->
    <g fill="#FFFFFF">
      <!-- Two-post Lift Column (Left side) -->
      <path d="M -38,38 L -22,38 L -24,35 L -36,35 Z" />
      <rect x="-32" y="-32" width="7" height="68" rx="1.5" />
      <rect x="-34" y="-15" width="11" height="7.5" rx="0.5" />
      <path d="M -25,-12 L 20,-12 L 20,-9 L -25,-9 Z" />

      <!-- Vehicle Silhouette Raised on Lift -->
      <g transform="translate(1, -28)">
        <path d="M -16,4 L -12,-8 L 12,-8 L 16,4 Z" />
        <path d="M -10,3 L -7,-6 L 7,-6 L 10,3 Z" fill="#9C0A0A" />
        <path d="M -24,4 C -24,3 -20,1 -16,1 L 16,1 C 20,1 24,3 24,4 L 25,13 C 25,14.5 23.5,15 22,15 L -22,15 C -23.5,15 -25,14.5 -25,13 Z" />
        <circle cx="-17" cy="9.5" r="2.4" fill="#9C0A0A" />
        <circle cx="17" cy="9.5" r="2.4" fill="#9C0A0A" />
        <rect x="-9" y="8.5" width="18" height="3" rx="0.5" fill="#9C0A0A" />
        <rect x="-25.5" y="12" width="4.5" height="6.5" rx="1.5" />
        <rect x="21" y="12" width="4.5" height="6.5" rx="1.5" />
      </g>

      <!-- Mechanic Figure Under Vehicle -->
      <g transform="translate(4, 16)">
        <circle cx="0" cy="-15" r="4.5" />
        <path d="M -4.5,-9 L 4.5,-9 L 3.8,9 L -3.8,9 Z" />
        <path d="M -4.5,-8 L -11,-20 L -8,-21 L -2.5,-9 Z" />
        <circle cx="-10" cy="-21.5" r="1.6" />
        <path d="M 4.5,-8 L 9,-18 L 11.5,-17 L 3.5,-7 Z" />
        <circle cx="10.5" cy="-18" r="1.6" />
        <rect x="-3.8" y="9" width="3.2" height="14" rx="0.5" />
        <rect x="0.6" y="9" width="3.2" height="14" rx="0.5" />
        <path d="M -5.5,22 L 0,22 L 0,24 L -6,24 Z" />
        <path d="M 0.6,22 L 6,22 L 6.5,24 L 0.6,24 Z" />
      </g>
    </g>
  </g>

  <!-- 2. Bold White Authentic Wordmark: "T & L" -->
  <g transform="translate(150, 195)">
    <path d="M -80,-27 L -28,-27 L -28,-14 L -43,-14 L -43,23 L -65,23 L -65,-14 L -80,-14 Z" fill="#FFFFFF" />
    <path d="M -16,23 L -16,14 C -13.5,18 -8.5,24 -0.5,24 C 9.5,24 16,18.5 16,11.5 C 16,5 11,0.5 4,-3.5 C 9.5,-7 12.5,-11.5 12.5,-17 C 12.5,-23.5 7,-27.5 -1.5,-27.5 C -9.5,-27.5 -15,-23 -15,-16 C -15,-10 -11,-6.5 -3,-2.5 C -10,3 -15.5,8.5 -15.5,15.5 L -16,23 Z M -0.5,-19 C 2.5,-19 4.5,-17.5 4.5,-15 C 4.5,-12.5 2.5,-10.5 -1,-8.5 C -4,-10.5 -6,-13 -6,-15.5 C -6,-17.5 -4,-19 -0.5,-19 Z M 4,11.5 C 4,15 0.5,17.5 -3,17.5 C -6.5,17.5 -8.5,15.5 -8.5,12.5 C -8.5,8 -3.5,3.5 2.5,0 C 3.5,4 4,8 4,11.5 Z" fill="#FFFFFF" />
    <path d="M 28,-27 L 50,-27 L 50,10 L 80,10 L 80,23 L 28,23 Z" fill="#FFFFFF" />
  </g>

  <!-- 3. Subtitle: "AUTO SERVICE INC." -->
  <text
    x="150"
    y="238"
    font-family="'Plus Jakarta Sans', 'Arial Black', -apple-system, sans-serif"
    font-size="14.5"
    font-weight="800"
    letter-spacing="3.4"
    text-anchor="middle"
    fill="#D4D4D8"
  >AUTO SERVICE INC.</text>

</svg>
