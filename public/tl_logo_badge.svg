<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- 3D Metallic Red Ring Gradient -->
    <radialGradient id="tlRedGradient" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF3838" />
      <stop offset="35%" stop-color="#DE1B1B" />
      <stop offset="75%" stop-color="#9C0A0A" />
      <stop offset="100%" stop-color="#550303" />
    </radialGradient>
    <!-- Chrome / Dark Outer Bezel -->
    <linearGradient id="tlBezelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D0606" />
      <stop offset="50%" stop-color="#1A0202" />
      <stop offset="100%" stop-color="#4A0808" />
    </linearGradient>
    <!-- Subtle top gloss sheen -->
    <linearGradient id="tlGloss" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Transparent background: Perfectly cut out circular badge -->
  <circle cx="150" cy="150" r="148" fill="#FFFFFF" />

  <!-- Outer subtle border for white badge definition -->
  <circle cx="150" cy="150" r="147" fill="none" stroke="#E5E7EB" stroke-width="1.5" />

  <!-- 1. Central Red Emblem (Medallion) -->
  <g transform="translate(150, 95)">
    <!-- Outer metallic bevel ring -->
    <circle cx="0" cy="0" r="54" fill="url(#tlBezelGradient)" stroke="#800D0D" stroke-width="1.5" />
    
    <!-- Glossy Red Inner Sphere -->
    <circle cx="0" cy="0" r="50" fill="url(#tlRedGradient)" />
    
    <!-- Top inner specular highlight -->
    <path d="M -40,-15 A 45,45 0 0,1 40,-15 A 47,40 0 0,0 -40,-15 Z" fill="url(#tlGloss)" />

    <!-- Pure White Mechanic + Car on Lift Graphic (Exact authentic shop icon) -->
    <g fill="#FFFFFF">
      <!-- Two-post Lift Column (Left side) -->
      <!-- Base plate -->
      <path d="M -36,36 L -20,36 L -22,33 L -34,33 Z" />
      <!-- Vertical post column -->
      <rect x="-30" y="-30" width="6.5" height="63" rx="1" />
      <!-- Lift carriage / mounting arm bracket -->
      <rect x="-32" y="-14" width="10" height="7" rx="0.5" />
      <!-- Horizontal lift support arm under car chassis -->
      <path d="M -23,-11 L 18,-11 L 18,-8 L -23,-8 Z" />

      <!-- Vehicle Silhouette Raised on Lift -->
      <g transform="translate(1, -26)">
        <!-- Car Body Roof & Greenhouse -->
        <path d="M -15,4 L -11,-7 L 11,-7 L 15,4 Z" />
        <!-- Windshield cutout / frame effect (dark or negative) -->
        <path d="M -9.5,3 L -6.5,-5 L 6.5,-5 L 9.5,3 Z" fill="#B31010" />
        
        <!-- Main Car Body / Hood / Front Bumper -->
        <path d="M -22,4 C -22,3 -19,1 -15,1 L 15,1 C 19,1 22,3 22,4 L 23,12 C 23,13.5 21.5,14 20,14 L -20,14 C -21.5,14 -23,13.5 -23,12 Z" />
        
        <!-- Headlights -->
        <circle cx="-16" cy="8.5" r="2.2" fill="#B31010" />
        <circle cx="16" cy="8.5" r="2.2" fill="#B31010" />
        
        <!-- Front grille / bumper intake line -->
        <rect x="-8" y="7.5" width="16" height="3" rx="0.5" fill="#B31010" />

        <!-- Car Wheels (left & right) -->
        <rect x="-23.5" y="11" width="4" height="6" rx="1.5" />
        <rect x="19.5" y="11" width="4" height="6" rx="1.5" />
      </g>

      <!-- Mechanic Figure Under Vehicle -->
      <g transform="translate(4, 15)">
        <!-- Head looking up at vehicle undercarriage -->
        <circle cx="0" cy="-14" r="4.2" />
        
        <!-- Torso in technician overalls -->
        <path d="M -4.2,-8 L 4.2,-8 L 3.5,8 L -3.5,8 Z" />
        
        <!-- Left arm raised upward working under chassis -->
        <path d="M -4.2,-7 L -10,-19 L -7.5,-20 L -2.5,-8 Z" />
        <circle cx="-9" cy="-20.5" r="1.5" />
        
        <!-- Right arm raised upward to engine/chassis -->
        <path d="M 4.2,-7 L 8,-17 L 10.5,-16 L 3,-6 Z" />
        <circle cx="9.5" cy="-17" r="1.5" />
        
        <!-- Legs standing on floor -->
        <rect x="-3.5" y="8" width="3" height="13" rx="0.5" />
        <rect x="0.5" y="8" width="3" height="13" rx="0.5" />
        <!-- Shoes / boots -->
        <path d="M -5,20 L 0,20 L 0,22 L -5.5,22 Z" />
        <path d="M 0.5,20 L 5.5,20 L 6,22 L 0.5,22 Z" />
      </g>
    </g>
  </g>

  <!-- 2. Bold Authentic Wordmark: "T & L" -->
  <g transform="translate(150, 202)">
    <!-- Letter "T" (Heavy slab serif style matching original logo) -->
    <path d="M -80,-27 L -28,-27 L -28,-14 L -43,-14 L -43,23 L -65,23 L -65,-14 L -80,-14 Z" fill="#0A0A0A" />

    <!-- Ampersand "&" (Chunky bold dynamic ampersand) -->
    <path d="M -16,23 L -16,14 C -13.5,18 -8.5,24 -0.5,24 C 9.5,24 16,18.5 16,11.5 C 16,5 11,0.5 4,-3.5 C 9.5,-7 12.5,-11.5 12.5,-17 C 12.5,-23.5 7,-27.5 -1.5,-27.5 C -9.5,-27.5 -15,-23 -15,-16 C -15,-10 -11,-6.5 -3,-2.5 C -10,3 -15.5,8.5 -15.5,15.5 L -16,23 Z M -0.5,-19 C 2.5,-19 4.5,-17.5 4.5,-15 C 4.5,-12.5 2.5,-10.5 -1,-8.5 C -4,-10.5 -6,-13 -6,-15.5 C -6,-17.5 -4,-19 -0.5,-19 Z M 4,11.5 C 4,15 0.5,17.5 -3,17.5 C -6.5,17.5 -8.5,15.5 -8.5,12.5 C -8.5,8 -3.5,3.5 2.5,0 C 3.5,4 4,8 4,11.5 Z" fill="#0A0A0A" />

    <!-- Letter "L" (Heavy slab serif style matching original logo) -->
    <path d="M 28,-27 L 50,-27 L 50,10 L 80,10 L 80,23 L 28,23 Z" fill="#0A0A0A" />
  </g>

  <!-- 3. Subtitle: "AUTO SERVICE INC." (Clean tracked uppercase) -->
  <text
    x="150"
    y="238"
    font-family="'Plus Jakarta Sans', 'Arial Black', -apple-system, sans-serif"
    font-size="14.5"
    font-weight="800"
    letter-spacing="3.2"
    text-anchor="middle"
    fill="#262626"
  >AUTO SERVICE INC.</text>

</svg>
